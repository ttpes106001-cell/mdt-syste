<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Capital | DOJ RP 警務系統</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-panel: #1a1d2d;
            --bg-card: #23273b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #2e334a;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--border-color); color: var(--accent-blue); text-align: center; }
        .nav-links { list-style: none; padding: 20px; }
        .nav-links li { padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .nav-links li:hover, .nav-links li.active { background-color: var(--accent-blue); color: #fff; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 30px; }
        .header-title { font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        .card { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .loading { color: var(--accent-yellow); font-weight: bold; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background-color: var(--bg-card); color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Stellar Capital MDT</div>
        <ul class="nav-links">
            <li class="active">市民身分查詢</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-title">系統與資料同步中心</div>
        
        <div class="card">
            <div id="status" class="loading">正在從 Google 試算表同步真實資料中...</div>
            <h3>系統資料清單</h3>
            <div style="overflow-x: auto;">
                <table id="dataTable">
                    <thead>
                        <tr id="tableHeaders">
                            <!-- 動態載入欄位 -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 已自動綁定您的 Google Apps Script API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbvCUzDB5m87fXrLe4SNGJaFlkDw1GO8nWD0jZjVNB9Q8zCC3PJCMirJ43wnRtWlDjQ/exec";

        async function loadSheetData() {
            const statusEl = document.getElementById("status");
            const headersEl = document.getElementById("tableHeaders");
            const bodyEl = document.getElementById("tableBody");

            try {
                let response = await fetch(API_URL);
                let result = await response.json();
                
                let data = result.systemData; // 取得 Google 試算表的真實資料
                
                if (!data || data.length === 0) {
                    statusEl.innerText = "同步完成，但試算表中目前沒有資料。";
                    return;
                }

                statusEl.innerText = "✔ 成功同步 Google 試算表真實資料！";
                statusEl.style.color = "var(--accent-green)";

                // 動態產生表格標題
                headersEl.innerHTML = "";
                let keys = Object.keys(data[0]);
                keys.forEach(key => {
                    let th = document.createElement("th");
                    th.innerText = key;
                    headersEl.appendChild(th);
                });

                // 動態填入表格內容
                bodyEl.innerHTML = "";
                data.forEach(row => {
                    let tr = document.createElement("th"); // 建立列
                    tr = document.createElement("tr");
                    keys.forEach(key => {
                        let td = document.createElement("td");
                        td.innerText = row[key] !== undefined ? row[key] : "";
                        tr.appendChild(td);
                    });
                    bodyEl.appendChild(tr);
                });

            } catch (error) {
                console.error("同步失敗：", error);
                statusEl.innerText = "❌ 同步失敗，請確認網路或 API 設定。";
                statusEl.style.color = "var(--accent-red)";
            }
        }

        // 頁面載入後自動執行同步
        window.addEventListener("DOMContentLoaded", loadSheetData);
    </script>
</body>
</html>
