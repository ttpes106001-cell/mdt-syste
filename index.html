<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Stellar Capital DOJ RP | MDT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #0b1118;
    color: #e8eef5;
}

.app {
    display: flex;
    height: 100vh;
}


/* =========================
   側邊欄
========================= */

.sidebar {

    width: 250px;

    background: #101923;

    border-right: 1px solid #263544;

    padding: 20px;
}

.logo {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 5px;
}

.logo span {
    color: #4da3ff;
}

.server {

    color: #7f91a4;

    font-size: 12px;

    margin-bottom: 25px;
}

.menu {

    display: flex;

    flex-direction: column;

    gap: 7px;
}

.menu button {

    width: 100%;

    padding: 13px;

    background: transparent;

    border: none;

    border-radius: 8px;

    color: #aebdcc;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}

.menu button:hover,
.menu button.active {

    background: #1c2c3c;

    color: white;
}


/* =========================
   主畫面
========================= */

.main {

    flex: 1;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.topbar {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 30px;

    background: #111c27;

    border-bottom: 1px solid #263544;
}

.page-title {

    font-size: 20px;

    font-weight: bold;
}

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 13px;

    color: #91a3b5;
}

.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #35d07f;
}

.content {

    padding: 30px;

    overflow-y: auto;

    flex: 1;
}


/* =========================
   首頁卡片
========================= */

.dashboard {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 18px;
}

.card {

    background: #121d28;

    border: 1px solid #263544;

    border-radius: 12px;

    padding: 22px;

    cursor: pointer;

    transition: 0.2s;
}

.card:hover {

    transform: translateY(-2px);

    border-color: #3c83c6;
}

.card-title {

    color: #8fa1b4;

    font-size: 13px;

    margin-bottom: 12px;
}

.card-number {

    font-size: 30px;

    font-weight: bold;
}


/* =========================
   搜尋
========================= */

.search-box {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}

.search-box input {

    flex: 1;

    padding: 13px 15px;

    border-radius: 8px;

    border: 1px solid #344555;

    background: #111b25;

    color: white;

    outline: none;

    font-size: 14px;
}

.search-box input:focus {

    border-color: #4da3ff;
}

.search-box button {

    padding: 0 22px;

    border: none;

    border-radius: 8px;

    background: #2675b9;

    color: white;

    cursor: pointer;
}


/* =========================
   資料卡
========================= */

.result {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));

    gap: 15px;
}

.result-card {

    background: #121d28;

    border: 1px solid #293b4c;

    border-radius: 10px;

    padding: 18px;
}

.result-header {

    display: flex;

    justify-content: space-between;

    margin-bottom: 15px;

    padding-bottom: 12px;

    border-bottom: 1px solid #263544;
}

.result-name {

    font-size: 17px;

    font-weight: bold;
}

.badge {

    padding: 4px 8px;

    border-radius: 5px;

    font-size: 11px;

    background: #1d6d4a;
}

.info {

    display: grid;

    grid-template-columns:
        100px 1fr;

    gap: 8px;

    font-size: 13px;
}

.label {

    color: #7f92a5;
}

.value {

    color: #e3eaf1;

    word-break: break-word;
}

.empty {

    text-align: center;

    padding: 60px;

    color: #738497;
}

.loading {

    text-align: center;

    padding: 40px;

    color: #7f91a4;
}

</style>

</head>


<body>

<div class="app">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        STELLAR <span>CAPITAL</span>
    </div>

    <div class="server">
        DOJ RP · MOBILE DATA TERMINAL
    </div>


    <div class="menu">

        <button
            class="active"
            onclick="showPage('dashboard', this)"
        >
            🏠 儀表板
        </button>

        <button
            onclick="showPage('person', this)"
        >
            👤 人員查詢
        </button>

        <button
            onclick="showPage('vehicle', this)"
        >
            🚗 車輛查詢
        </button>

        <button
            onclick="showPage('wanted', this)"
        >
            🚨 通緝／協尋
        </button>

    </div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


<header class="topbar">

    <div
        class="page-title"
        id="pageTitle"
    >
        儀表板
    </div>

    <div class="status">

        <span class="status-dot"></span>

        MDT SYSTEM ONLINE

    </div>

</header>


<section class="content">


<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboardPage">

    <h2>Stellar Capital DOJ RP</h2>

    <p style="color:#8193a5;">
        Mobile Data Terminal
    </p>


    <div class="dashboard">

        <div
            class="card"
            onclick="openSearch('person')"
        >

            <div class="card-title">
                人員資料
            </div>

            <div
                class="card-number"
                id="personCount"
            >
                -
            </div>

        </div>


        <div
            class="card"
            onclick="openSearch('vehicle')"
        >

            <div class="card-title">
                車輛資料
            </div>

            <div
                class="card-number"
                id="vehicleCount"
            >
                -
            </div>

        </div>


        <div
            class="card"
            onclick="openSearch('wanted')"
        >

            <div class="card-title">
                通緝／協尋
            </div>

            <div
                class="card-number"
                id="wantedCount"
            >
                -
            </div>

        </div>

    </div>

</div>


<!-- =========================
     SEARCH PAGE
========================= -->

<div
    id="searchPage"
    style="display:none;"
>

    <div class="search-box">

        <input
            id="searchInput"
            placeholder="輸入姓名、身分證字號、車牌、案件編號..."
            onkeydown="if(event.key==='Enter') searchData()"
        >

        <button onclick="searchData()">
            搜尋
        </button>

    </div>


    <div
        id="results"
        class="result"
    ></div>

</div>


</section>

</main>

</div>


<script>

/* ==================================
   Google Apps Script API
================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx8bilTXc_KJaJSAmwrxUQo8q37jsuQLJAaN6gJSL5EmSibTuJGM8siLF4aM9c3F9x0aQ/exec";


/* ==================================
   全域資料
================================== */

let currentPage = "dashboard";

let allData = {
    persons: [],
    vehicles: [],
    wanted: []
};


/* ==================================
   頁面切換
================================== */

function showPage(page, button) {

    currentPage = page;

    document
        .querySelectorAll(".menu button")
        .forEach(btn => btn.classList.remove("active"));

    if (button) {
        button.classList.add("active");
    }


    document.getElementById("dashboardPage")
        .style.display =
        page === "dashboard"
            ? "block"
            : "none";


    document.getElementById("searchPage")
        .style.display =
        page === "dashboard"
            ? "none"
            : "block";


    const titles = {

        dashboard: "儀表板",

        person: "人員查詢",

        vehicle: "車輛查詢",

        wanted: "通緝／協尋"

    };


    document.getElementById("pageTitle")
        .textContent = titles[page];


    if (page !== "dashboard") {

        document.getElementById("searchInput")
            .value = "";

        document.getElementById("results")
            .innerHTML =
            '<div class="empty">請輸入查詢條件</div>';
    }
}


/* ==================================
   從首頁開啟查詢
================================== */

function openSearch(type) {

    const buttons =
        document.querySelectorAll(".menu button");

    const index = {

        person: 1,

        vehicle: 2,

        wanted: 3

    }[type];


    showPage(type, buttons[index]);
}


/* ==================================
   API 請求
================================== */

async function fetchData(action, query = "") {

    const url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&q=" +
        encodeURIComponent(query);


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "無法連接 Google 試算表"
        );
    }


    const json =
        await response.json();


    if (!json.success) {

        throw new Error(
            json.message || "API 發生錯誤"
        );
    }


    return json.data;
}


/* ==================================
   搜尋資料
================================== */

async function searchData() {

    const query =
        document.getElementById("searchInput")
            .value
            .trim();


    const results =
        document.getElementById("results");


    results.innerHTML =
        '<div class="loading">正在查詢資料...</div>';


    try {

        let action;


        if (currentPage === "person") {

            action = "person";

        } else if (currentPage === "vehicle") {

            action = "vehicle";

        } else if (currentPage === "wanted") {

            action = "wanted";

        }


        const data =
            await fetchData(action, query);


        renderResults(data);

    } catch (error) {

        results.innerHTML =
            `<div class="empty">
                ❌ 查詢失敗<br>
                <small>${escapeHtml(error.message)}</small>
            </div>`;
    }
}


/* ==================================
   顯示搜尋結果
================================== */

function renderResults(data) {

    const results =
        document.getElementById("results");


    if (!data || data.length === 0) {

        results.innerHTML =
            '<div class="empty">找不到相關資料</div>';

        return;
    }


    results.innerHTML =
        data.map(item => {

            return `

            <div class="result-card">

                <div class="result-header">

                    <div class="result-name">

                        ${
                            escapeHtml(
                                getDisplayName(item)
                            )
                        }

                    </div>

                    ${
                        currentPage === "wanted"
                        ?
                        `<div class="badge">
                            ${escapeHtml(
                                item["狀態"] || "未知"
                            )}
                        </div>`
                        :
                        ""
                    }

                </div>


                <div class="info">

                    ${
                        Object.entries(item)
                        .map(([key, value]) => `

                            <div class="label">
                                ${escapeHtml(key)}
                            </div>

                            <div class="value">
                                ${escapeHtml(value)}
                            </div>

                        `)
                        .join("")
                    }

                </div>

            </div>

            `;

        }).join("");
}


/* ==================================
   卡片標題
================================== */

function getDisplayName(item) {

    if (currentPage === "person") {

        return item["姓名"]
            || item["ID"]
            || "未知人員";
    }


    if (currentPage === "vehicle") {

        return item["車牌"]
            || "未知車輛";
    }


    if (currentPage === "wanted") {

        return item["案件編號"]
            || item["姓名"]
            || "未知案件";
    }


    return "資料";
}


/* ==================================
   HTML 安全處理
================================== */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }


    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ==================================
   載入統計
================================== */

async function loadDashboard() {

    try {

        const data =
            await fetchData("all");


        allData = data;


        document.getElementById("personCount")
            .textContent =
            data.persons.length;


        document.getElementById("vehicleCount")
            .textContent =
            data.vehicles.length;


        document.getElementById("wantedCount")
            .textContent =
            data.wanted.length;


    } catch (error) {

        console.error(error);

    }
}


/* ==================================
   啟動
================================== */

loadDashboard();

</script>

</body>

</html>
